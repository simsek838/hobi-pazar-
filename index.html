<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hobi Pazarı — El Emeği & Koleksiyon Pazaryeri</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cream: #fdf6ec;
      --warm: #f5e6cc;
      --amber: #e8a84c;
      --amber-dark: #c4862a;
      --brown: #3d2b1f;
      --brown-light: #6b4c37;
      --green: #4a7c59;
      --green-light: #d4ead9;
      --red: #c0392b;
      --gray: #888;
      --white: #fff;
      --shadow: 0 4px 24px rgba(61,43,31,0.10);
      --radius: 16px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cream);
      color: var(--brown);
      min-height: 100vh;
    }

    /* ─── HEADER ─── */
    header {
      background: var(--brown);
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 2px 12px rgba(0,0,0,0.18);
    }

    .header-inner {
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 24px;
      height: 68px;
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      font-weight: 900;
      color: var(--amber);
      text-decoration: none;
      letter-spacing: -0.5px;
      white-space: nowrap;
    }
    .logo span { color: var(--cream); }

    .search-bar {
      flex: 1;
      display: flex;
      background: rgba(255,255,255,0.10);
      border: 1.5px solid rgba(255,255,255,0.18);
      border-radius: 10px;
      overflow: hidden;
    }
    .search-bar input {
      flex: 1;
      padding: 10px 16px;
      border: none;
      background: transparent;
      color: var(--cream);
      font-size: 0.95rem;
      font-family: 'DM Sans', sans-serif;
      outline: none;
    }
    .search-bar input::placeholder { color: rgba(255,255,255,0.45); }
    .search-bar button {
      padding: 0 20px;
      background: var(--amber);
      border: none;
      cursor: pointer;
      font-size: 1.1rem;
      transition: background 0.2s;
    }
    .search-bar button:hover { background: var(--amber-dark); }

    .nav-btns { display: flex; gap: 10px; align-items: center; }
    .user-badge { color: var(--amber); font-weight: 600; font-size: 0.95rem; background: rgba(255,255,255,0.1); padding: 6px 14px; border-radius: 8px; display: none; }
    
    .btn {
      padding: 9px 20px;
      border-radius: 9px;
      border: none;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      display: inline-block;
    }
    .btn-outline {
      background: transparent;
      border: 1.5px solid rgba(255,255,255,0.4);
      color: var(--cream);
    }
    .btn-outline:hover { border-color: var(--amber); color: var(--amber); }
    .btn-amber { background: var(--amber); color: var(--brown); }
    .btn-amber:hover { background: var(--amber-dark); }

    /* ─── HERO ─── */
    .hero {
      background: linear-gradient(135deg, var(--brown) 0%, #5c3d28 60%, var(--brown-light) 100%);
      padding: 72px 24px 80px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23ffffff' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
    }
    .hero-badge {
      display: inline-block;
      background: rgba(232,168,76,0.2);
      color: var(--amber);
      border: 1px solid rgba(232,168,76,0.4);
      padding: 5px 16px;
      border-radius: 100px;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 22px;
    }
    .hero h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.2rem, 5vw, 3.6rem);
      font-weight: 900;
      color: var(--cream);
      line-height: 1.15;
      margin-bottom: 18px;
    }
    .hero h1 em { color: var(--amber); font-style: normal; }
    .hero p {
      color: rgba(253,246,236,0.72);
      font-size: 1.1rem;
      max-width: 500px;
      margin: 0 auto 36px;
      line-height: 1.6;
    }
    .hero-actions { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
    
    .btn-big {
      padding: 14px 32px;
      font-size: 1rem;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.2s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }
    .btn-big.amber { background: var(--amber); color: var(--brown); }
    .btn-big.amber:hover { background: var(--amber-dark); transform: translateY(-2px); }
    .btn-big.ghost { background: rgba(255,255,255,0.1); color: var(--cream); border: 1.5px solid rgba(255,255,255,0.25); }
    .btn-big.ghost:hover { background: rgba(255,255,255,0.18); }

    .hero-stats {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-top: 52px;
      flex-wrap: wrap;
    }
    .stat { text-align: center; }
    .stat-num { font-family: 'Playfair Display', serif; font-size: 1.8rem; font-weight: 700; color: var(--amber); }
    .stat-lbl { font-size: 0.8rem; color: rgba(253,246,236,0.55); text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }

    /* ─── KATEGORİLER ─── */
    .section { max-width: 1200px; margin: 0 auto; padding: 64px 24px; }
    .section-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 32px;
    }
    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.9rem;
      font-weight: 700;
    }
    .see-all { color: var(--amber-dark); font-size: 0.9rem; font-weight: 600; text-decoration: none; }
    .see-all:hover { text-decoration: underline; }

    .categories {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 14px;
    }
    .cat-card {
      background: var(--white);
      border-radius: 14px;
      padding: 22px 12px 18px;
      text-align: center;
      cursor: pointer;
      border: 2px solid transparent;
      transition: all 0.22s;
      box-shadow: var(--shadow);
    }
    .cat-card:hover { border-color: var(--amber); transform: translateY(-3px); }
    .cat-icon { font-size: 2rem; margin-bottom: 8px; }
    .cat-name { font-size: 0.82rem; font-weight: 600; color: var(--brown); }
    .cat-count { font-size: 0.72rem; color: var(--gray); margin-top: 2px; }

    /* ─── ÜRÜNLER ─── */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 22px;
    }
    .product-card {
      background: var(--white);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      transition: all 0.25s;
      cursor: pointer;
      position: relative;
    }
    .product-card:hover { transform: translateY(-5px); box-shadow: 0 12px 36px rgba(61,43,31,0.15); }

    .product-img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      background: var(--warm);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 4rem;
    }
    .badge-new, .badge-sold {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 3px 10px;
      border-radius: 6px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge-new { background: var(--green); color: #fff; }
    .badge-sold { background: var(--red); color: #fff; }

    .fav-btn {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 34px;
      height: 34px;
      background: rgba(255,255,255,0.92);
      border-radius: 50%;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .fav-btn:hover { transform: scale(1.15); }

    .product-info { padding: 16px; }
    .product-title { font-weight: 600; font-size: 0.95rem; margin-bottom: 6px; line-height: 1.35; }
    .product-meta { display: flex; align-items: center; justify-content: space-between; }
    .product-price { font-size: 1.2rem; font-weight: 700; color: var(--amber-dark); }
    .product-seller { font-size: 0.78rem; color: var(--gray); }
    .product-seller span { color: var(--green); font-weight: 600; }
    .product-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-top: 1px solid #f0e8da;
      font-size: 0.8rem;
      color: var(--gray);
    }
    .product-location::before { content: "📍 "; }
    .product-date::before { content: "🕐 "; }

    /* ─── NASIL ÇALIŞIR ─── */
    .how-it-works {
      background: var(--brown);
      padding: 72px 24px;
      text-align: center;
    }
    .how-inner { max-width: 1000px; margin: 0 auto; }
    .how-it-works .section-title { color: var(--cream); margin-bottom: 12px; }
    .how-subtitle { color: rgba(253,246,236,0.6); margin-bottom: 52px; font-size: 1.05rem; }
    .steps {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 30px;
    }
    .step {
      background: rgba(255,255,255,0.07);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: var(--radius);
      padding: 32px 24px;
    }
    .step-num {
      width: 48px; height: 48px;
      background: var(--amber);
      color: var(--brown);
      font-family: 'Playfair Display', serif;
      font-size: 1.4rem;
      font-weight: 700;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 18px;
    }
    .step h3 { color: var(--cream); font-size: 1rem; margin-bottom: 8px; }
    .step p { color: rgba(253,246,236,0.55); font-size: 0.87rem; line-height: 1.55; }

    /* ─── BANNER ─── */
    .cta-banner {
      background: linear-gradient(120deg, var(--amber) 0%, #f0b34a 100%);
      padding: 56px 24px;
      text-align: center;
    }
    .cta-banner h2 {
      font-family: 'Playfair Display', serif;
      font-size: 2rem;
      font-weight: 700;
      color: var(--brown);
      margin-bottom: 10px;
    }
    .cta-banner p { color: rgba(61,43,31,0.72); margin-bottom: 28px; font-size: 1.05rem; }
    .btn-dark { background: var(--brown); color: var(--cream); }
    .btn-dark:hover { background: #2a1d14; }

    /* ─── FOOTER ─── */
    footer {
      background: #2a1d14;
      color: rgba(253,246,236,0.55);
      padding: 48px 24px 28px;
    }
    .footer-inner {
      max-width: 1200px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 40px;
      padding-bottom: 36px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
    }
    .footer-brand .logo { font-size: 1.4rem; display: block; margin-bottom: 14px; }
    .footer-brand p { font-size: 0.88rem; line-height: 1.65; }
    .footer-col h4 { color: var(--cream); font-size: 0.9rem; font-weight: 600; margin-bottom: 14px; }
    .footer-col a {
      display: block;
      color: rgba(253,246,236,0.5);
      text-decoration: none;
      font-size: 0.85rem;
      margin-bottom: 9px;
      transition: color 0.2s;
    }
    .footer-col a:hover { color: var(--amber); }
    .footer-bottom {
      max-width: 1200px;
      margin: 24px auto 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.82rem;
      flex-wrap: wrap;
      gap: 10px;
    }

    /* ─── MODAL ─── */
    .modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.55);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: var(--white);
      border-radius: 20px;
      padding: 40px;
      width: 100%;
      max-width: 420px;
      position: relative;
      animation: slideUp 0.25s ease;
      max-height: 90vh;
      overflow-y: auto;
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(30px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .modal-close {
      position: absolute; top: 16px; right: 16px;
      background: none; border: none; font-size: 1.4rem;
      cursor: pointer; color: var(--gray);
    }
    .modal h2 {
      font-family: 'Playfair Display', serif;
      font-size: 1.7rem;
      margin-bottom: 6px;
    }
    .modal-sub { color: var(--gray); font-size: 0.9rem; margin-bottom: 28px; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%;
      padding: 11px 14px;
      border: 1.5px solid #e5d8c8;
      border-radius: 9px;
      font-size: 0.95rem;
      font-family: 'DM Sans', sans-serif;
      outline: none;
      transition: border 0.2s;
    }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: var(--amber); }
    .modal-btn {
      width: 100%;
      padding: 13px;
      background: var(--amber);
      color: var(--brown);
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      font-family: 'DM Sans', sans-serif;
      cursor: pointer;
      margin-top: 6px;
      transition: background 0.2s;
    }
    .modal-btn:hover { background: var(--amber-dark); }
    .modal-switch { text-align: center; margin-top: 18px; font-size: 0.88rem; color: var(--gray); }
    .modal-switch a { color: var(--amber-dark); cursor: pointer; font-weight: 600; text-decoration: underline; }
    
    .alert-danger { display: none; background: #f8d7da; color
